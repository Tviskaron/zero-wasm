name: Build Zero WASM for GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Publish compiled files to gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/publish-pages.sh
      - name: Deploy the compiled branch
        env:
          GH_TOKEN: ${{ github.token }}
        # Token-authenticated pushes do not trigger workflows; dispatch does.
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref gh-pages
